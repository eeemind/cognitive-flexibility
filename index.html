<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10121b">
<title>Cognitive Flexibility</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#10121b; --bg2:#171a27; --panel:#1b1f2d; --panel2:#23283a;
    --line:rgba(255,255,255,.09); --muted:#939bb1; --text:#f3f5ff;
    --accent:#a5b4fc; --accent2:#818cf8; --good:#71e1b1; --bad:#ff8294;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{overflow:hidden;background:radial-gradient(ellipse at 50% 43%,rgba(69,79,135,.17),transparent 40%),var(--bg)}
  button,input,select{font:inherit}
  button{color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a5b4fc;outline-offset:3px}
  .app{height:100dvh;min-height:480px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .topbar{height:88px;flex:0 0 88px;position:relative;z-index:2;padding-top:13px}
  .brand{position:absolute;top:13px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
  .brand h1{font-size:clamp(17px,2.4vw,21px);font-weight:650;letter-spacing:.025em;margin:0;color:#f7f8ff}
  .brand a{display:inline-block;margin-top:3px;color:#98a3ca;font-size:11px;letter-spacing:.02em;text-decoration:none;pointer-events:auto}
  .brand a:hover{color:#d2d8ff;text-decoration:underline}
  .left-tools{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:7px}
  .right-tools{position:absolute;top:12px;right:12px}
  .tool-btn{border:1px solid var(--line);border-radius:12px;background:rgba(28,32,48,.8);padding:8px 10px;display:flex;align-items:center;gap:7px;font-size:12px;color:#d9def2;box-shadow:0 4px 18px rgba(0,0,0,.12);transition:background .15s,border-color .15s}
  .tool-btn:hover{background:#272d42;border-color:rgba(165,180,252,.35)}
  .tool-btn svg{width:15px;height:15px;flex:none;opacity:.9}
  .game-area{min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px 7px;position:relative}
  .cue-stack{min-height:54px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;margin-bottom:10px;gap:7px;width:min(94vw,850px)}
  .step-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#98a2be;min-height:12px}
  .rule-line{font-size:clamp(10px,1.4vw,12px);line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:#bdc5df;min-height:16px}
  .rule-line .rule-key{color:#f0f2ff;font-weight:700}
  .shift-banner{font-size:11px;line-height:1.5;letter-spacing:.035em;text-transform:none;color:#c9ceff;white-space:pre-line;text-align:center;max-width:min(96vw,850px);min-height:12px;opacity:0;transition:opacity .2s}
  .shift-banner.visible{opacity:1}
  .shift-banner.mapping-change{color:#d7dcff;font-weight:600}
  .stimulus-stage{width:min(94vw,850px);min-height:210px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:19px;transition:opacity .14s;overflow:visible}
  .stimulus-stage.dim{opacity:.25}
  .empty-state{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
  .empty-title{font-size:18px;font-weight:600;color:#e9ecfb}
  .empty-sub{font-size:12px;color:var(--muted)}
  .primary-btn{border:0;border-radius:12px;background:linear-gradient(135deg,#a5b4fc,#818cf8);color:#16182a;font-weight:750;padding:11px 19px;box-shadow:0 8px 24px rgba(129,140,248,.16)}
  .primary-btn:hover{filter:brightness(1.06)}
  .stimulus-word{font-size:clamp(37px,7.6vw,68px);line-height:1.08;letter-spacing:.025em;font-weight:850;text-align:center;max-width:100%;overflow-wrap:anywhere;text-shadow:0 5px 22px rgba(0,0,0,.16)}
  .stimulus-pair{font-size:clamp(24px,5vw,48px);line-height:1.15;letter-spacing:.015em;font-weight:850;text-align:center;overflow-wrap:anywhere;max-width:96vw}
  .shape-stage{display:flex;justify-content:center;align-items:center;min-height:110px;gap:10px;flex-wrap:wrap;max-width:min(90vw,550px)}
  .shape-stage svg{display:block;filter:drop-shadow(0 5px 13px rgba(0,0,0,.14));flex:none}
  .digit-pair{display:flex;align-items:baseline;justify-content:center;gap:clamp(15px,5vw,42px);flex-wrap:wrap}
  .digit-glyph{font-size:clamp(64px,11vw,105px);font-weight:800;line-height:1}
  .digit-word{font-size:clamp(24px,5vw,47px);font-weight:750;letter-spacing:.03em}
  .quantity-stage{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:5px 9px;align-items:center;justify-items:center;width:min(85vw,270px);min-height:100px}
  .quantity-stage svg{width:clamp(28px,5.6vw,48px);height:clamp(28px,5.6vw,48px)}
  .session-meta{height:19px;margin-top:7px;color:#747e98;font-size:11px;letter-spacing:.04em;text-align:center}
  .answer-zone{flex:0 0 auto;min-height:105px;padding:11px 14px max(17px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:9px;position:relative;z-index:1}
  .answer-prompt{font-size:10px;letter-spacing:.13em;color:#8f99b3;text-transform:uppercase;text-align:center;min-height:12px}
  .answer-buttons{display:flex;justify-content:center;align-items:stretch;gap:clamp(6px,1.5vw,13px);width:100%;max-width:760px}
  .set-button{width:clamp(39px,6.6vw,58px);height:clamp(43px,6.5vw,54px);border-radius:13px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(180deg,#272d43,#1b2031);font-size:15px;font-weight:750;box-shadow:0 5px 12px rgba(0,0,0,.17);transition:transform .1s,background .1s,border-color .1s;touch-action:manipulation}
  .set-button:hover:not(:disabled){background:#343b56;border-color:rgba(165,180,252,.4);transform:translateY(-2px)}
  .set-button:active:not(:disabled){transform:scale(.97)}
  .set-button:disabled{opacity:.35;cursor:default}
  .set-button .small-no{font-size:9px;display:block;color:#aeb8d6;font-weight:500;margin-top:1px}
  .feedback{height:16px;font-size:11px;letter-spacing:.03em;color:var(--muted);text-align:center}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
  .overlay{position:absolute;inset:0;background:rgba(3,5,13,.57);backdrop-filter:blur(3px);z-index:10;opacity:0;pointer-events:none;transition:opacity .22s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:absolute;top:0;bottom:0;width:min(420px,92vw);z-index:11;background:rgba(24,28,42,.98);border-color:var(--line);box-shadow:0 0 55px rgba(0,0,0,.35);display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.75,.2,1);backdrop-filter:blur(18px)}
  .drawer.left{left:0;border-right:1px solid var(--line);transform:translateX(-103%)}
  .drawer.right{right:0;border-left:1px solid var(--line);transform:translateX(103%)}
  .drawer.open{transform:translateX(0)}
  .drawer-head{height:67px;flex:0 0 67px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid var(--line)}
  .drawer-head h2{font-size:16px;letter-spacing:.01em;margin:0;font-weight:700}
  .drawer-head .sub{font-size:11px;color:var(--muted);margin-top:3px}
  .close-btn{height:34px;width:34px;border:1px solid var(--line);border-radius:10px;background:#23283a;display:grid;place-items:center;color:#dce1f5;font-size:21px;line-height:1}
  .drawer-body{overflow:auto;overscroll-behavior:contain;padding:17px 18px 28px;flex:1}
  .section-label{font-size:10px;letter-spacing:.14em;color:#8e99b5;text-transform:uppercase;margin:2px 0 11px}
  .setting-section{margin-bottom:23px}
  .session-controls{display:flex;gap:9px}
  .session-controls button{flex:1}
  .secondary-btn{border:1px solid var(--line);border-radius:11px;background:#292f43;color:#e4e8fa;padding:10px 12px;font-size:12px;font-weight:650}
  .secondary-btn:hover{background:#343c55}
  .danger-btn{border-color:rgba(255,130,148,.22);color:#ffb0bb;background:rgba(115,36,51,.23)}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 12px}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .field.full{grid-column:1/-1}
  .field label,.field .field-label{font-size:12px;color:#d9def2;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .field .hint{font-size:10px;color:#7f89a4;font-weight:400}
  .field input[type=number],.field select{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:#141827;color:#f2f4ff;padding:0 10px;font-size:12px;outline-offset:2px}
  .field input[type=number]{appearance:textfield}
  .field input[type=number]::-webkit-inner-spin-button{appearance:none}
  .toggle-row{display:flex;gap:8px;flex-wrap:wrap}
  .toggle-chip{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#151a29;color:#bac3dc;font-size:12px;cursor:pointer;flex:1;min-width:84px}
  .toggle-chip input{accent-color:#a5b4fc;margin:0}
  .toggle-chip:has(input:checked){background:rgba(129,140,248,.14);border-color:rgba(165,180,252,.36);color:#edf0ff}
  .toggle-chip:has(input:disabled){opacity:.7;cursor:default}
  .settings-note{font-size:10px;color:#858fab;line-height:1.45;margin-top:8px}
  fieldset{border:0;padding:0;margin:0;min-width:0}
  fieldset:disabled{opacity:.52}
  .mapping-group{margin-bottom:19px}
  .mapping-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .mapping-title strong{font-size:12px;font-weight:700}
  .mapping-title span{font-size:10px;color:#8993ad}
  .mapping-items{display:flex;flex-wrap:wrap;gap:7px}
  .mapping-item{border:1px solid var(--line);background:#191e2d;border-radius:9px;padding:6px 8px;font-size:11px;color:#d1d7ec;display:flex;align-items:center;gap:6px;max-width:100%}
  .mapping-item .set-tag{color:#aeb9ff;font-weight:750;font-size:10px}
  .mapping-item.no-go{border-color:rgba(255,130,148,.45);background:rgba(115,36,51,.2)}
  .mapping-item .ng{font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:#ff9bab;font-weight:800}
  .mapping-empty{font-size:12px;color:#8c96b0;line-height:1.6}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:23px}
  .stat-card{padding:14px 13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,rgba(39,45,66,.8),rgba(25,29,44,.8));min-width:0}
  .stat-card .value{font-size:23px;font-weight:750;letter-spacing:-.03em;color:#f0f2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-card .label{font-size:10px;color:#939db7;margin-top:4px}
  .progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
  .progress-row span:first-child{color:#aab3cb}.progress-row strong{font-weight:650;color:#e9ecfa;text-align:right}
  .history-item{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px}
  .history-item .date{color:#dce1f4;font-weight:650}.history-item .detail{margin-top:4px;color:#8c96b0}.history-item .percent{font-size:15px;font-weight:750;color:#c5ccff}
  .tiny-muted{font-size:10px;color:#7f89a4;line-height:1.5}
  @media (max-width:600px){
    .topbar{height:82px;flex-basis:82px}
    .brand{top:14px}
    .brand h1{font-size:16px}
    .brand a{font-size:10px}
    .left-tools{left:8px;top:9px;gap:6px}
    .right-tools{right:8px;top:9px}
    .tool-btn{padding:8px;border-radius:10px;gap:5px;font-size:11px}
    .tool-btn .tool-label{display:none}
    .game-area{padding:0 8px 2px}
    .cue-stack{min-height:47px;margin-bottom:5px;gap:5px;width:98vw}
    .rule-line{max-width:98vw;font-size:9px;letter-spacing:.035em}
    .stimulus-stage{min-height:180px;gap:14px;width:98vw}
    .answer-zone{min-height:99px;padding-left:7px;padding-right:7px}
    .set-button{width:clamp(31px,8.2vw,47px);height:45px;border-radius:11px;font-size:14px}
    .answer-buttons{gap:clamp(4px,1.3vw,7px)}
    .drawer-body{padding:15px 14px 24px}
    .field-grid{gap:12px 9px}
    .quantity-stage{gap:3px 5px}
  }
  @media (max-height:620px){
    .topbar{height:73px;flex-basis:73px}
    .brand{top:9px}
    .stimulus-stage{min-height:135px;gap:9px}
    .cue-stack{min-height:40px;margin-bottom:1px}
    .answer-zone{min-height:87px;padding-top:6px;padding-bottom:max(9px,env(safe-area-inset-bottom))}
    .shape-stage{min-height:85px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="left-tools">
      <button class="tool-btn" id="openSettings" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="tool-label">Settings</span>
      </button>
      <button class="tool-btn" id="openSets" aria-label="Show stimulus sets" title="Sets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="tool-label">Sets</span>
      </button>
    </div>
    <div class="brand"><h1>Cognitive Flexibility</h1><a href="https://discord.gg/brain" target="_blank" rel="noopener noreferrer">Mindbuilding Discord</a></div>
    <div class="right-tools">
      <button class="tool-btn" id="openProgress" aria-label="Open progress" title="Progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/></svg><span class="tool-label">Progress</span>
      </button>
    </div>
  </header>

  <main class="game-area">
    <div class="cue-stack">
      <div class="step-label" id="stepLabel"></div>
      <div class="rule-line" id="ruleLine"></div>
      <div class="shift-banner" id="shiftBanner" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <div class="stimulus-stage" id="stimulusStage" aria-live="polite">
      <div class="empty-state" id="emptyState">
        <div class="empty-title">Ready?</div>
        <div class="empty-sub">Start a session when you're ready.</div>
        <button class="primary-btn" id="mainStart">Start session</button>
      </div>
    </div>
    <div class="session-meta" id="sessionMeta"></div>
  </main>

  <footer class="answer-zone">
    <div class="answer-prompt" id="answerPrompt">Choose the matching set</div>
    <div class="answer-buttons" id="answerButtons"></div>
    <div class="feedback" id="feedback"></div>
  </footer>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer left" id="leftDrawer" aria-hidden="true">
    <div class="drawer-head"><div><h2 id="leftTitle">Settings</h2><div class="sub" id="leftSub">Tune your session</div></div><button class="close-btn" data-close aria-label="Close panel">×</button></div>
    <div class="drawer-body" id="leftBody"></div>
  </aside>
  <aside class="drawer right" id="rightDrawer" aria-hidden="true">
    <div class="drawer-head"><div><h2>Progress</h2><div class="sub">Your practice history</div></div><button class="close-btn" data-close aria-label="Close panel">×</button></div>
    <div class="drawer-body" id="rightBody"></div>
  </aside>
</div>
<script>
(() => {
  'use strict';
  const COLORS = [
    {name:'red',hex:'#ff657a'}, {name:'blue',hex:'#59a8ff'}, {name:'green',hex:'#58d6a4'},
    {name:'purple',hex:'#b39aff'}, {name:'yellow',hex:'#f6d65a'}, {name:'cyan',hex:'#52dfeb'},
    {name:'lime',hex:'#b6ed62'}, {name:'magenta',hex:'#f078d2'}, {name:'orange',hex:'#ffa45e'}
  ];
  const SHAPES = ['square','circle','triangle','star','octagon','pentagon','hexagon','heptagon','rhomb'];
  const DIGITS = [1,2,3,4,5,6,7,8,9];
  const DIGIT_WORDS = {1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine'};
  const COLOR_BY_NAME = Object.fromEntries(COLORS.map(c => [c.name,c]));
  const $ = id => document.getElementById(id);
  const random = arr => arr[Math.floor(Math.random()*arr.length)];
  const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  const pickOther = (arr, value) => random(arr.filter(v => v !== value));
  const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const fmtTime = secs => { secs=Math.max(0,Math.floor(secs||0)); const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60; return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}:${String(s).padStart(2,'0')}`; };
  const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const prettyDate = key => { if(!key) return '—'; const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
  const defaults = {trials:50,mappingEvery:20,shiftCount:2,mappingAnnouncementSeconds:3,colors:true,shapes:true,digits:true,sets:4,nogo:false,maxPerSet:8,stroop:'none',attentionEvery:8,responseTimeLimitEnabled:false,responseTimeLimitSeconds:2};
  const state = {
    settings:{...defaults}, maps:[], digitMaps:[], session:null, trial:null, completed:0, correct:0,
    attention:{color:'word',shape:'text',digit:'glyph'}, drawer:null, bannerTimer:null, bannerPriority:0, noGoTimer:null, responseTimer:null, feedbackTimer:null, locked:false,
    stats:{totalSeconds:0,totalTrials:0,correctTrials:0,days:[],sessions:[]}
  };

  function loadStats(){
    try { const saved=JSON.parse(localStorage.getItem('cf-progress-v1')||'null'); if(saved && typeof saved==='object') state.stats={...state.stats,...saved,days:Array.isArray(saved.days)?saved.days:[],sessions:Array.isArray(saved.sessions)?saved.sessions:[]}; }
    catch(e) { /* clean start if local storage is unavailable */ }
  }
  function saveStats(){ try { localStorage.setItem('cf-progress-v1',JSON.stringify(state.stats)); } catch(e) {} }
  function selectedModes(){
    if(state.settings.stroop==='double') return ['color','shape'];
    if(state.settings.stroop==='triple') return ['color','shape','digit'];
    const out=[]; if(state.settings.colors)out.push('color');if(state.settings.shapes)out.push('shape');if(state.settings.digits)out.push('digit');return out;
  }
  function mappingDomainItems(){ return state.maps; }
  function buildMappings(){
    const s=state.settings, modes=selectedModes(), cap=s.sets*s.maxPerSet;
    let items=[];
    if(s.stroop==='double' || s.stroop==='triple'){
      const colors=COLORS.slice(0,5), shapes=SHAPES.slice(0,5);
      let combos=[]; colors.forEach(color=>shapes.forEach(shape=>combos.push({id:`combo:${color.name}:${shape}`,kind:'combo',color:color.name,shape,label:`${color.name.toUpperCase()} ${shape.toUpperCase()}`})));
      items=shuffle(combos).slice(0,Math.min(combos.length,cap));
    } else {
      if(s.colors) COLORS.forEach(c=>items.push({id:`color:${c.name}`,kind:'color',value:c.name,label:c.name.toUpperCase()}));
      if(s.shapes) SHAPES.forEach(shape=>items.push({id:`shape:${shape}`,kind:'shape',value:shape,label:shape.toUpperCase()}));
      if(s.digits) DIGITS.forEach(d=>items.push({id:`digit:${d}`,kind:'digit',value:d,label:String(d)}));
      items=shuffle(items).slice(0,cap);
    }
    state.maps=assignSets(items,s.sets,s.maxPerSet);
    if(s.stroop==='triple'){
      const digitItems=DIGITS.map(d=>({id:`digit:${d}`,kind:'digit',value:d,label:String(d)}));
      state.digitMaps=assignSets(shuffle(digitItems).slice(0,Math.min(digitItems.length,cap)),s.sets,s.maxPerSet);
    } else state.digitMaps=[];
    if(s.nogo){
      const all=[...state.maps,...state.digitMaps];
      const count=Math.max(1,Math.round(all.length*.1));
      shuffle(all).slice(0,count).forEach(item=>item.noGo=true);
    }
    renderAnswerButtons();
    if(state.drawer==='sets') renderSetsPanel();
  }

    const renderItem=item=>`<div class="mapping-item ${item.noGo?'no-go':''}"><span>${escapeHtml(item.label)}</span><span class="set-tag">${item.set}</span>${item.noGo?'<span class="ng">No-go</span>':''}</div>`;
    let body='';
    if(!state.maps.length){body='<div class="mapping-empty">No stimuli are available. Enable a stimulus type in Settings.</div>';}
    if(double){
      body+=`<div class="mapping-group"><div class="mapping-title"><strong>${state.settings.stroop==='triple'?'Color + shape':'Color + shape'}</strong><span>${state.maps.length} stimuli</span></div><div class="mapping-items">${state.maps.map(renderItem).join('')}</div></div>`;
      if(state.settings.stroop==='triple')body+=`<div class="mapping-group"><div class="mapping-title"><strong>Digits</strong><span>${state.digitMaps.length} stimuli</span></div><div class="mapping-items">${state.digitMaps.map(renderItem).join('')}</div></div>`;
    }else{
      grouped.forEach(g=>{body+=`<div class="mapping-group"><div class="mapping-title"><strong>Set ${g.set}</strong><span>${g.items.length} stimuli</span></div><div class="mapping-items">${g.items.map(item=>`<div class="mapping-item ${item.noGo?'no-go':''}">${escapeHtml(item.label)}${item.noGo?'<span class="ng">No-go</span>':''}</div>`).join('')||'<span class="tiny-muted">No stimuli</span>'}</div></div>`;});
    }
    const nogoItems=[...state.maps,...state.digitMaps].filter(x=>x.noGo);
    $('leftBody').innerHTML=`<div class="section-label">Current mappings</div>${body}<div class="setting-section" style="margin-top:22px"><div class="mapping-title"><strong>No-go set</strong><span>${state.settings.nogo?nogoItems.length:0} stimuli</span></div>${state.settings.nogo?`<div class="mapping-items">${nogoItems.map(x=>`<div class="mapping-item no-go">${escapeHtml(x.label)}<span class="ng">No-go</span></div>`).join('')||'<span class="tiny-muted">None assigned</span>'}</div>`:'<div class="mapping-empty">No-go ICT is off.</div>'}</div><div class="tiny-muted">Mappings can shift during a session. Open this panel to check the current sets.</div>`;
  }
  function renderProgressPanel(){
    const s=state.stats;const accuracy=s.totalTrials?Math.round(s.correctTrials/s.totalTrials*100):0;
    const live=state.session;const today=todayKey();
    const sessions=(s.sessions||[]).slice(0,10);
    $('rightBody').innerHTML=`
      <div class="stats-grid">
        <div class="stat-card"><div class="value">${fmtTime(s.totalSeconds+(live?Math.floor((Date.now()-live.startedAt)/1000):0))}</div><div class="label">Time played</div></div>
        <div class="stat-card"><div class="value">${s.totalTrials?accuracy+'%':'—'}</div><div class="label">Overall accuracy</div></div>
        <div class="stat-card"><div class="value">${s.days.length}</div><div class="label">Days played</div></div>
        <div class="stat-card"><div class="value">${s.sessions.length+(live?1:0)}</div><div class="label">Sessions</div></div>
      </div>
      <div class="section-label">Current session</div>
      <div class="progress-row"><span>Status</span><strong>${live?'In progress':'Not started'}</strong></div>
      <div class="progress-row"><span>Mode</span><strong>${modeName(state.settings.stroop)}</strong></div>
      <div class="progress-row"><span>Trials</span><strong>${live?`${live.trials} / ${live.planned}`:'—'}</strong></div>
      <div class="progress-row"><span>Accuracy</span><strong>${live&&live.trials?Math.round(live.correct/live.trials*100)+'%':'—'}</strong></div>
      <div class="section-label" style="margin-top:24px">Recent sessions</div>
      ${sessions.length?sessions.map(x=>`<div class="history-item"><div><div class="date">${prettyDate(x.day)}</div><div class="detail">${x.trials} trials · ${fmtTime(x.duration)}</div></div><div class="percent">${Math.round((x.accuracy||0)*100)}%</div></div>`).join(''):'<div class="mapping-empty">Your completed sessions will appear here.</div>'}
      <div class="tiny-muted" style="margin-top:18px">Progress is saved on this device.</div>`;
  }
  function openDrawer(which){
    if(which==='settings')renderSettingsPanel();if(which==='sets')renderSetsPanel();if(which==='progress')renderProgressPanel();
    state.drawer=which;$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');
    $('leftDrawer').classList.toggle('open',which==='settings'||which==='sets');$('leftDrawer').setAttribute('aria-hidden',String(!(which==='settings'||which==='sets')));
    $('rightDrawer').classList.toggle('open',which==='progress');$('rightDrawer').setAttribute('aria-hidden',String(which!=='progress'));
  }
  function closeDrawers(){state.drawer=null;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');$('leftDrawer').classList.remove('open');$('rightDrawer').classList.remove('open');$('leftDrawer').setAttribute('aria-hidden','true');$('rightDrawer').setAttribute('aria-hidden','true');}
  function renderInitial(){
    buildMappings();renderAnswerButtons();renderSettingsPanel();renderProgressPanel();
    $('openSettings').addEventListener('click',()=>openDrawer('settings'));
    $('openSets').addEventListener('click',()=>openDrawer('sets'));
    $('openProgress').addEventListener('click',()=>openDrawer('progress'));
    $('overlay').addEventListener('click',closeDrawers);
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeDrawers));
    $('mainStart').addEventListener('click',startSession);
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){closeDrawers();return;}
      if(!state.session||state.drawer||e.ctrlKey||e.metaKey||e.altKey)return;
      const target=e.target;
      if(target && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT','BUTTON'].includes(target.tagName)))return;
      if(/^[1-9]$/.test(e.key)){const n=Number(e.key);if(n<=state.settings.sets)handleSetPress(n);}
    });
    setInterval(()=>{if(state.session){renderSessionMeta();if(state.drawer==='progress')renderProgressPanel();}},1000);
  }
  loadStats();renderInitial();
})();
</script>
</body>
</html>
